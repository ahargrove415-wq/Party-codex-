<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>The Party Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a guild ledger. Sticky brass nav band, one reading column, wide canvases (skill trees) scroll sideways inside their own frame. */
:root{
  --bg:#e9ebf2; --panel:#f7f8fb; --sunk:#dfe2ec; --ink:#1c1e2f; --muted:#5a5d76; --line:#c9cddd;
  --brass:#8a5a0b; --brass-soft:#f0e3c6; --arcane:#1d7473; --arcane-soft:#d5ecea; --danger:#ad3a30;
  --r0:#6f7388; --r1:#2f7f4b; --r2:#2f62b3; --r3:#7a43b6; --r4:#a66f0c; --r5:#b5372f; --r6:#6b6f86;
  --f-display:"Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --f-body:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11131f; --panel:#191c2d; --sunk:#0d0f19; --ink:#e8e5da; --muted:#9a9ab2; --line:#2c3050;
  --brass:#e2ae4f; --brass-soft:#3a2f19; --arcane:#5fc2bd; --arcane-soft:#15302f; --danger:#e57a70;
  --r0:#9095aa; --r1:#5fc07f; --r2:#6f9ff0; --r3:#b58bf0; --r4:#e8b04a; --r5:#f0776c; --r6:#8d91a8;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11131f; --panel:#191c2d; --sunk:#0d0f19; --ink:#e8e5da; --muted:#9a9ab2; --line:#2c3050;
  --brass:#e2ae4f; --brass-soft:#3a2f19; --arcane:#5fc2bd; --arcane-soft:#15302f; --danger:#e57a70;
  --r0:#9095aa; --r1:#5fc07f; --r2:#6f9ff0; --r3:#b58bf0; --r4:#e8b04a; --r5:#f0776c; --r6:#8d91a8;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--arcane)}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.1rem,5vw,3.2rem);letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:1.7rem}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* top band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px;min-height:56px}
.brand{font-family:var(--f-display);font-size:1.45rem;font-weight:700;color:var(--brass);text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 11px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a.on{color:var(--ink);background:var(--brass-soft)}
.save-pill{font-size:.78rem;white-space:nowrap;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.save-pill.live{border-color:var(--arcane);color:var(--arcane)}
@media (max-width:720px){.save-pill{display:none}}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:28px}
.note{border:1px solid var(--brass);background:var(--brass-soft);padding:10px 14px;border-radius:var(--radius);font-size:.95rem}

/* generic blocks */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
a.card{text-decoration:none;color:inherit}
a.card:hover{border-color:var(--brass)}
.card .meta{font-size:.86rem;color:var(--muted)}
.section{display:grid;gap:14px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--panel)}
.btn.small{padding:3px 9px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=number],input[type=text],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
textarea{width:100%;min-height:110px;resize:vertical}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.dots{margin:0;padding-left:1.1em;display:grid;gap:4px}
.lede{font-size:1.12rem;max-width:68ch;color:var(--muted)}
.prose{max-width:70ch;display:grid;gap:10px}

/* ranks */
.rk{--rc:var(--r0);display:inline-block;min-width:2.2em;text-align:center;font-family:var(--f-mono);font-size:.74rem;font-weight:500;padding:1px 6px;border-radius:5px;border:1px solid var(--rc);color:var(--rc);background:color-mix(in srgb,var(--rc) 13%,transparent);white-space:nowrap}
.rk.t1{--rc:var(--r1)}.rk.t2{--rc:var(--r2)}.rk.t3{--rc:var(--r3)}.rk.t4{--rc:var(--r4)}.rk.t5{--rc:var(--r5)}.rk.t6{--rc:var(--r6);border-style:dashed}

/* hero */
.hero{display:grid;gap:12px;padding-block:8px 4px}
.hero .sigil{font-family:var(--f-mono);font-size:.82rem;color:var(--brass)}
.counts{display:flex;gap:22px;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
.counts b{font-family:var(--f-mono);color:var(--ink);font-weight:500;margin-right:4px}

/* roster */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input{flex:1;min-width:200px}
.char-card h3{font-size:1.12rem}
.char-card .line{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted)}

/* sheet */
.sheet-head{display:grid;gap:8px}
.sheet{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:900px){.sheet{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--panel);outline:1px solid var(--line);padding:9px 12px;display:grid;gap:2px;min-width:0}
.stat .k{font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:1rem;overflow-wrap:anywhere}
.list{display:grid;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.li:first-child{border-top:0}
.li .nm{font-weight:700}
.li .ds{grid-column:2;color:var(--muted);font-size:.94rem}
.li .nums{grid-column:2;font-family:var(--f-mono);font-size:.82rem;color:var(--brass)}
.li.nochip{grid-template-columns:minmax(0,1fr)}
.li.nochip .ds,.li.nochip .nums{grid-column:1}
.tracker{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (max-width:900px){.tracker{position:static}}
.meter{display:grid;gap:4px}
.meter .bar{height:9px;border-radius:9px;background:var(--sunk);overflow:hidden}
.meter .fill{height:100%;background:var(--arcane)}
.meter.hp .fill{background:var(--danger)}
.meter.xp .fill{background:var(--brass)}
.meter .lbl{display:flex;justify-content:space-between;font-size:.86rem}
.adj{display:flex;gap:6px;flex-wrap:wrap}
.adj input{width:120px}
.servant{border:1px solid var(--brass);border-radius:var(--radius);padding:16px;display:grid;gap:12px;background:var(--panel)}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.param{display:grid;gap:4px}
.param .k{font-size:.78rem;color:var(--muted)}
.pbar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brass)}

/* trees */
.tree-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:960px){.tree-wrap{grid-template-columns:minmax(0,1fr)}}
.canvas-frame{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--muted) 22%,transparent) 1px, transparent 0) 0 0/22px 22px, var(--sunk)}
.canvas{position:relative}
.canvas svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--line);stroke-width:2}
.edge.on{stroke:var(--arcane);stroke-width:2.6}
.lane{position:absolute;left:14px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.node{position:absolute;width:168px;height:74px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel);padding:6px 9px;text-align:left;cursor:pointer;display:grid;grid-template-rows:auto 1fr;gap:2px;transition:transform .12s, border-color .12s}
.node:hover{transform:translateY(-1px);border-color:var(--brass)}
.node .nn{font-weight:700;font-size:.9rem;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node .nr{display:flex;justify-content:space-between;align-items:center;gap:6px}
.node .nc{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.node.on{border-color:var(--arcane);background:var(--arcane-soft)}
.node.on .nc{color:var(--arcane)}
.node.open{border-color:var(--brass);border-style:dashed}
.node.short,.node.locked{opacity:.6}
.node.blocked{opacity:.38}
.node.blocked .nn{text-decoration:line-through}
.node.ph{border-style:dotted;background:transparent}
.node.sel{outline:2.5px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.node{transition:none}.node:hover{transform:none}}
.side{display:grid;gap:14px}
.legend{display:grid;gap:6px;font-size:.88rem}
.legend span.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:6px}
.points{font-family:var(--f-mono);font-size:1.6rem;color:var(--brass)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0;white-space:nowrap}

/* dice */
.dice-out{font-family:var(--f-mono);font-size:2.6rem;color:var(--brass);line-height:1}
.dice-out.crit{color:var(--arcane)}
.dice-out.fail{color:var(--danger)}
.die-row{display:flex;gap:6px;flex-wrap:wrap}
.die-row .btn{font-family:var(--f-mono);min-width:56px}
.die-row .btn.on{background:var(--brass-soft);border-color:var(--brass)}
.log{font-family:var(--f-mono);font-size:.84rem;display:grid;gap:4px;max-height:220px;overflow:auto}
.ladder{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ladder .arrow{color:var(--muted);font-size:.8rem}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:9px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.src-list li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* forms & builder */
.form{display:grid;gap:22px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fld{display:grid;gap:4px;font-size:.84rem;color:var(--muted);min-width:0}
.fld input,.fld textarea,.fld select{color:var(--ink);font-size:1rem;width:100%}
.fld.wide{grid-column:1/-1}
.rep{display:grid;gap:8px}
.rep-row{display:grid;gap:6px;align-items:start}
.rep-row input,.rep-row textarea{width:100%;min-width:0}
.rep-row textarea{min-height:40px}
.rep-del{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--muted)}
.rep-del:hover{border-color:var(--danger);color:var(--danger)}
@media (max-width:640px){.rep-row{grid-template-columns:minmax(0,1fr) auto !important}.rep-row>[data-k]{grid-column:1}.rep-row>.rep-del{grid-column:2;grid-row:1}}
.fieldset{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
.fieldset>h3{font-family:var(--f-display);font-weight:500;font-size:1.35rem}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:150px;overflow:auto;font-size:.92rem}
.checks label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.danger{color:var(--danger)}
.btn.danger.primary{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:28px 20px;display:grid;gap:10px;justify-items:start;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.empty h3{font-family:var(--f-display);font-weight:500;font-size:1.5rem}
.canvas.editing .node{cursor:pointer}
.edit-hint{font-size:.86rem;color:var(--muted)}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw-btn{width:30px;height:30px;border-radius:6px;border:2px solid var(--line);cursor:pointer;color:var(--muted);font-size:.8rem}
.sw-btn.on{border-color:var(--brass);outline:2px solid var(--brass);outline-offset:1px}
.map-frame{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--sunk);max-height:72vh}
.mat-stage{position:relative;width:max-content}
.tok-layer{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:700;display:grid;place-items:center;cursor:grab;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.45);user-select:none;padding:0;font-family:var(--f-body)}
.tok:active{cursor:grabbing}
.tok.hid{opacity:.55;border-style:dashed}
.tok.act{outline:3px solid var(--brass);outline-offset:2px}
.tok.sel{box-shadow:0 0 0 3px var(--arcane),0 2px 6px rgba(0,0,0,.45)}
.tok .hpb{position:absolute;left:12%;right:12%;bottom:-8px;height:4px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden}
.tok .hpb i{display:block;height:100%;background:#e05a4f}
.role{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.role button{border:0;background:transparent;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--muted);font-weight:500}
.role button.on{background:var(--brass);color:var(--panel)}
.ai-prev{max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--line)}
.dmbox{border-color:var(--r5)}
.dmbox textarea{min-height:90px}
.mat-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:960px){.mat-wrap{grid-template-columns:minmax(0,1fr)}}
body.player .dm-only{display:none!important}
#mapcv,#matcv{display:block}
#matcv{touch-action:none}
.mk{--mk-bg:#14161c;--mk-panel:#1c1f28;--mk-line:#2d3140;--mk-ink:#e8e4d8;--mk-muted:#8f94a7;--mk-acc:#e2ae4f;display:grid;grid-template-columns:62px minmax(0,1fr) 296px;grid-template-rows:auto minmax(0,1fr);height:min(80vh,880px);min-height:540px;background:var(--mk-bg);color:var(--mk-ink);border-radius:14px;overflow:hidden;border:1px solid var(--mk-line);box-shadow:0 10px 30px rgba(0,0,0,.25);color-scheme:dark}
.mk-top{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--mk-line);flex-wrap:wrap;background:var(--mk-panel)}
.mk-name{font-family:"IM Fell English SC",Georgia,serif;font-size:1.15rem;background:transparent!important;border:1px solid transparent!important;color:var(--mk-ink)!important;min-width:0;width:min(260px,100%);padding:4px 8px;border-radius:7px}
.mk-name:hover,.mk-name:focus{border-color:var(--mk-line)!important}
.mk-sep{width:1px;height:22px;background:var(--mk-line)}
.mk-z{font-family:var(--f-mono);font-size:.8rem;color:var(--mk-muted);min-width:3.2em;text-align:center}
.btnk{background:#272b37;border:1px solid var(--mk-line);color:var(--mk-ink);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:.86rem;text-decoration:none;font-family:var(--f-body)}
.btnk:hover{border-color:var(--mk-acc)}
.btnk:disabled{opacity:.4;cursor:default}
.btnk.on{background:var(--mk-acc);color:#1b1408;border-color:var(--mk-acc)}
.btnk.acc{background:var(--mk-acc);color:#1b1408;border-color:var(--mk-acc);font-weight:700}
.btnk.warn{color:#f0877c;border-color:#5a2d2a}
.mk select,.mk input[type=text]{background:#10121a;color:var(--mk-ink);border:1px solid var(--mk-line);border-radius:7px;padding:5px 8px}
.mk-chk{display:flex;gap:6px;align-items:center;font-size:.86rem;color:var(--mk-ink)}
.mk-rail{display:flex;flex-direction:column;gap:4px;padding:8px 7px;border-right:1px solid var(--mk-line);background:var(--mk-panel);overflow-y:auto}
.mk-rail button{width:46px;height:46px;border-radius:10px;border:0;background:transparent;color:var(--mk-muted);display:grid;place-items:center;cursor:pointer}
.mk-rail button:hover{color:var(--mk-ink);background:#262a36}
.mk-rail button.on{background:#2e3343;color:var(--mk-acc);box-shadow:inset 3px 0 0 var(--mk-acc)}
.mk-stage{border:0!important;border-radius:0!important;overflow:auto;background:radial-gradient(circle at 1px 1px,#262a36 1px,transparent 0) 0 0/18px 18px,#0f1116;padding:36px}
.mk-stage canvas{margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.6);touch-action:none;cursor:crosshair}
.mk-stage canvas.tool-select{cursor:default}.mk-stage canvas.tool-pan{cursor:grab}.mk-stage canvas.tool-text{cursor:text}
.mk-panel{border-left:1px solid var(--mk-line);background:var(--mk-panel);overflow-y:auto;padding:14px;display:grid;gap:12px;align-content:start}
.mk-panel h4{margin:0;font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:1.25rem;letter-spacing:.02em}
.mk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

function writeFail(e){ if(FB.on&&e&&e.code==="permission-denied"){ toast(FB.user?"Only the DM can change that.":"Sign in with Google (top right) to make changes."); return; } if(e&&e.code==="invalid_argument"&&S.db){ if(typeof CAP!=="undefined") CAP.readOnly=true; toast("You can't change that with your access. Ask the DM to invite you by email with edit access."); setTimeout(()=>render(true),0); } else toast("Couldn't save: "+((e&&e.message)||"unknown error")); }
const chain={};
function put(col,id,doc,quiet){ doc.updatedAt=Date.now(); S.data[col]=Object.assign({},S.data[col],{[id]:doc});
 if(S.db){ const k=col+"/"+id; chain[k]=(chain[k]||Promise.resolve()).then(()=>S.db.collection(col).doc(id).set(doc)).catch(writeFail); }
 else LS.set("codex2:"+col,S.data[col]);
 if(!quiet) render(true); }
function del(col,id){ const m=Object.assign({},S.data[col]); delete m[id]; S.data[col]=m;
 if(S.db){ const k=col+"/"+id; chain[k]=(chain[k]||Promise.resolve()).then(()=>S.db.collection(col).doc(id).delete()).catch(writeFail); }
 else LS.set("codex2:"+col,S.data[col]); }
const chars=()=>Object.entries(S.data.characters).map(([id,c])=>Object.assign({id},c));
const trees=()=>Object.entries(S.data.trees).map(([id,t])=>Object.assign({id},t));
const worlds=()=>Object.entries(S.data.worlds).map(([id,w])=>Object.assign({id},w));
const getC=id=>S.data.characters[id]?clone(S.data.characters[id]):null;
const getT=id=>S.data.trees[id]?clone(S.data.trees[id]):null;
const getW=id=>S.data.worlds[id]?clone(S.data.worlds[id]):null;
const costs=()=>(S.data.settings.rules&&S.data.settings.rules.costs)||DEFAULT_COSTS.map(([r,c])=>({rank:r,cost:c}));
function costOf(n){ if(n.cost!==""&&n.cost!=null&&!isNaN(n.cost)) return Number(n.cost);
 const r=String(n.r||"").trim().toLowerCase(), tb=costs();
 let hit=tb.find(x=>String(x.rank).trim().toLowerCase()===r); if(hit) return num(hit.cost);
 const base=r.replace(/[+\-]+$/,""); hit=tb.find(x=>String(x.rank).trim().toLowerCase()===base); return hit?num(hit.cost):0; }

async function initDb(){
 let db=null; try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){ db=null; } if(!db) db=fbInit();
 if(!db){ S.mode="local"; COLS.forEach(c=>S.data[c]=LS.get("codex2:"+c)||{}); render(true); return; }
 S.db=db; S.mode="live";
 const seen=new Set(); const timer=setTimeout(()=>{ if(seen.size<COLS.length){ S.note="Your party's data can't be reached yet. Anything you add will save once it connects."; render(); } },10000);
 COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>m[d.id]=d.data()); S.data[col]=m;
   if(!snap.metadata.fromCache){ seen.add(col); if(seen.size===COLS.length){ clearTimeout(timer); S.note=""; } } render(); },
  err=>{ clearTimeout(timer); S.db=null; S.mode="local"; S.note="Live saving stopped ("+(err&&err.code)+"). New changes save in this browser only."; render(true); }));
}

function exMap(t){ const m={}; (t.nodes||[]).forEach(n=>(n.ex||[]).forEach(o=>{ (m[n.id]=m[n.id]||new Set()).add(o); (m[o]=m[o]||new Set()).add(n.id); })); return m; }
function treeState(t,un,points){ const st={}, ex=exMap(t);
 (t.nodes||[]).forEach(n=>{ if(un.has(n.id)){st[n.id]="on";return;} if(n.ph){st[n.id]="ph";return;}
  if(ex[n.id]&&[...ex[n.id]].some(x=>un.has(x))){st[n.id]="blocked";return;}
  const ok=(n.req||[]).every(r=>un.has(r))&&(!(n.any&&n.any.length)||n.any.some(r=>un.has(r)));
  st[n.id]=!ok?"locked":(costOf(n)<=points?"open":"short"); }); return st; }
function canRefund(t,un,id){ return !(t.nodes||[]).some(m=>un.has(m.id)&&m.id!==id&&(((m.req||[]).includes(id))||(m.any&&m.any.includes(id)&&!m.any.some(a=>a!==id&&un.has(a))))); }
const BRANCH_COLORS=["#b77cf2","#f39a2b","#3fc7e8","#5fd06a","#f4c84a","#ef5a5a","#5b8cff","#e86cc0","#40d9b0","#d98a5b"];
function radial(t){
 const nodes=t.nodes||[]; const map={}; nodes.forEach(n=>map[n.id]=n);

 const depth={}; const dfs=(n,stack)=>{ if(depth[n.id]!=null) return depth[n.id]; if(stack.has(n.id)) return 0; stack.add(n.id); const ps=parents(n); const d=ps.length?Math.max(...ps.map(p=>dfs(map[p],stack)+1)):0; stack.delete(n.id); depth[n.id]=d; return d; };

 if(roots.length===1&&(kids[roots[0].id]||[]).length>1){ hub=roots[0]; roots=kids[hub.id]; shift=1; }
 const total=roots.reduce((a,r)=>a+(leaves[r.id]||1),0)||1;

function canvas(t,st,selId,mode,tid){

 const col=id=>{ const b=L.branch[id]; return b==null||b<0?"#e2ae4f":BRANCH_COLORS[b%BRANCH_COLORS.length]; };
 const isOn=id=>mode!=="edit"&&st[id]==="on";
 let edges="";
 const line=(a,b,on,c,dash)=>{ edges+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="sky-edge ${on?"on":""}" style="--c:${c}"${dash?' stroke-dasharray="4 4"':""}/>`; };
 nodes.forEach(n=>{ const ps=[...(n.req||[]).map(r=>[r,0]),...(n.any||[]).map(r=>[r,1])].filter(([r])=>L.map[r]);
  if(!ps.length&&(!L.hub||n.id!==L.hub.id)) line([cx,cy],xy(n.id),isOn(n.id),col(n.id));
  ps.forEach(([r,dash])=>line(xy(r),xy(n.id),isOn(r)&&isOn(n.id),col(n.id),dash)); });

  return `<button class="sk ${s} ${n.ph?"ph":""} ${isHub?"root":""} ${selId===n.id?"sel":""}" style="left:${(x-17).toFixed(1)}px;top:${(y-17).toFixed(1)}px;--c:${col(n.id)}" data-act="${mode==="edit"?"esel":"sel"}" data-t="${tid}" data-n="${n.id}" title="${esc(n.n||"Unnamed")}${n.r?" · "+esc(n.r):""}${mode==="edit"?"":s==="on"?" · unlocked":n.ph?"":" · "+costOf(n)+" pts"}" aria-label="${esc(n.n||"Unnamed")}, ${s==="on"?"unlocked":s||"skill"}"><span class="ic">${esc(n.icon||initials(n.n))}</span>${n.r?`<span class="rkb">${esc(n.r)}</span>`:""}<span class="lb">${esc(n.n||"Unnamed")}</span></button>`; }).join("");

function hexMix(h,amt){ const n=parseInt(h.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const t=amt<0?0:255,p=Math.abs(amt); r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p); return `rgb(${r},${g},${b})`; }
/* ---- textures ---- */
const TEX={};
function makeTex(t){ const S=96, cv=document.createElement("canvas"); cv.width=cv.height=S; const x=cv.getContext("2d"); const base=TER[t].c; const rnd=rng(t.charCodeAt(0)*977+13);
 x.fillStyle=base; x.fillRect(0,0,S,S);

/* ---- editing ops ---- */
function subAt(cv,e,m){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*m.w,(e.clientY-r.top)/r.height*m.h]; }
function paintAt(m,sx,sy,t,rad){ const PW=m.w*R, PH=m.h*R, cx=sx*R, cy=sy*R; const r=rad*.75;
 for(let j=Math.floor(cy-r-1);j<=cy+r+1;j++) for(let i=Math.floor(cx-r-1);i<=cx+r+1;i++){ if(i<0||j<0||i>=PW||j>=PH) continue; const d=Math.hypot(i+.5-cx,j+.5-cy); if(d<=r-.4||(d<=r+.9&&Math.random()<.4)) m.paint[j*PW+i]=t; } }
function fogAt(m,sx,sy,v,rad){ const r=Math.max(.5,rad/4); for(let j=Math.floor(sy-r);j<=sy+r;j++) for(let i=Math.floor(sx-r);i<=sx+r;i++){ if(i<0||j<0||i>=m.w||j>=m.h) continue; if(Math.hypot(i+.5-sx,j+.5-sy)<=r+.2) m.fog[j*m.w+i]=v; } }
function hitObj(m,sx,sy){ for(let i=m.objects.length-1;i>=0;i--){ const o=m.objects[i]; const rr=(o.s||1)*.45; if(Math.abs(o.x-sx)<=rr&&Math.abs(o.y-sy)<=rr) return i; } return -1; }
function hitLabel(m,sx,sy){ for(let i=m.labels.length-1;i>=0;i--){ const l=m.labels[i]; const h=({s:.45,m:.7,l:1.1,xl:1.7})[l.size]||.7; const w=String(l.text).length*h*.42; if(Math.abs(l.x-sx)<=w/2+.2&&Math.abs(l.y-sy)<=h*.6) return i; } return -1; }
const FOREST=["pine","tree","pine","bush","tree"];
let mkDrag=null, lastScatter=null;
function mkDown(cv,e){ const m=ui.mw&&ui.mw.m; if(!m) return; const K=ui.mk; const [sx,sy]=subAt(cv,e,m);
 if(K.tool==="pan"){ const f=cv.closest(".canvas-frame"); mkDrag={pan:true,f,x:e.clientX,y:e.clientY,sl:f.scrollLeft,st:f.scrollTop}; return true; }
 if(K.tool==="select"){ let i=hitObj(m,sx,sy); if(i>=0){ K.sel={t:"o",i}; } else { i=hitLabel(m,sx,sy); K.sel=i>=0?{t:"l",i}:null; }
  if(K.sel){ pushUndo(); const it=K.sel.t==="o"?m.objects[K.sel.i]:m.labels[K.sel.i]; mkDrag={move:true,it,ox:it.x-sx,oy:it.y-sy,moved:false}; }
  $(".mk-panel").innerHTML=mkPanel(m); redrawCanvases(); return true; }
 pushUndo();
 if(K.tool==="paint"){ paintAt(m,sx,sy,K.t,K.size); mkDrag={paint:true}; }
 else if(K.tool==="erase"){ mkErase(m,sx,sy); mkDrag={erase:true}; }
 else if(K.tool==="fog"){ fogAt(m,sx,sy,K.fogMode==="reveal"?"1":"0",K.size); mkDrag={fog:true}; }
 else if(K.tool==="stamp"){ const st=STAMPS[K.stamp]; const ob={k:K.stamp,x:+sx.toFixed(2),y:+sy.toFixed(2),s:+(st.s*K.scale).toFixed(2)}; if(K.rot){ ob.r=Math.round((Math.random()-.5)*30); ob.f=Math.random()<.5; } m.objects.push(ob); }
 else if(K.tool==="scatter"){ lastScatter=null; scatterAt(m,sx,sy); mkDrag={scatter:true}; }
 else if(K.tool==="text"){ const t=(K.text||"").trim(); if(!t){ toast("Type the label text in the panel first"); ui.mw.undo.pop(); return true; } m.labels.push({x:+sx.toFixed(2),y:+sy.toFixed(2),text:t.slice(0,60),size:K.tsize,style:K.tstyle,hidden:K.thidden}); }
 queueMapSave(); redrawCanvases(); return true; }
function mkMove(cv,e){ const m=ui.mw&&ui.mw.m; if(!m||!mkDrag) return; const K=ui.mk;
 if(mkDrag.pan){ mkDrag.f.scrollLeft=mkDrag.sl-(e.clientX-mkDrag.x); mkDrag.f.scrollTop=mkDrag.st-(e.clientY-mkDrag.y); return; }
 const [sx,sy]=subAt(cv,e,m);
 if(mkDrag.move){ mkDrag.it.x=+Math.max(0,Math.min(m.w,sx+mkDrag.ox)).toFixed(2); mkDrag.it.y=+Math.max(0,Math.min(m.h,sy+mkDrag.oy)).toFixed(2); mkDrag.moved=true; }
 else if(mkDrag.paint) paintAt(m,sx,sy,K.t,K.size);
 else if(mkDrag.erase) mkErase(m,sx,sy);
 else if(mkDrag.fog) fogAt(m,sx,sy,K.fogMode==="reveal"?"1":"0",K.size);
 else if(mkDrag.scatter) scatterAt(m,sx,sy);
 else return;
 queueMapSave(); redrawCanvases(); }
function mkUp(){ if(!mkDrag) return; const d=mkDrag; mkDrag=null; if(d.move&&!d.moved&&ui.mw.undo.length) ui.mw.undo.pop(); if(!d.pan){ const b=$('[data-act="mk-undo"]'); if(b) b.disabled=!ui.mw.undo.length; } }
function mkErase(m,sx,sy){ const r=Math.max(.4,ui.mk.size/4); m.objects=m.objects.filter(o=>Math.hypot(o.x-sx,o.y-sy)>r); m.labels=m.labels.filter(l=>Math.hypot(l.x-sx,l.y-sy)>r); ui.mk.sel=null; }
function scatterAt(m,sx,sy){ const K=ui.mk; if(lastScatter&&Math.hypot(sx-lastScatter[0],sy-lastScatter[1])<.9/K.density) return; lastScatter=[sx,sy];
 const r=Math.max(.5,K.size/4), n=Math.max(1,Math.round(K.density/2)); const forest=STAMPS[K.stamp].cat==="Nature"&&["pine","tree","bush"].includes(K.stamp);
 for(let i=0;i<n;i++){ const a=Math.random()*7, d=Math.sqrt(Math.random())*r; const k=forest&&Math.random()<.5?FOREST[Math.floor(Math.random()*FOREST.length)]:K.stamp; const st=STAMPS[k];
  const x=sx+Math.cos(a)*d, y=sy+Math.sin(a)*d; if(x<0||y<0||x>m.w||y>m.h) continue; m.objects.push({k,x:+x.toFixed(2),y:+y.toFixed(2),s:+(st.s*K.scale*(.8+Math.random()*.4)).toFixed(2),f:Math.random()<.5}); }
 if(m.objects.length>2500) m.objects.splice(0,m.objects.length-2500); }
function roughen(m,passes){ const PW=m.w*R, PH=m.h*R; for(let p=0;p<passes;p++){ const src=m.paint.slice(); for(let j=0;j<PH;j++) for(let i=0;i<PW;i++){ const k=j*PW+i; const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>{ const x=i+a,y=j+b; return x>=0&&y>=0&&x<PW&&y<PH?src[y*PW+x]:null; }).filter(v=>v&&v!==src[k]); if(nb.length&&Math.random()<.32) m.paint[k]=nb[Math.floor(Math.random()*nb.length)]; } } }
async function mapAi(id){
 const M=ui.mapAi; const m=workMap(id); const desc=M.desc.trim(); if(!desc){ toast("Describe the place first"); return; }
 const legend=Object.entries(TER).map(([k,v])=>`"${k}"=${v.n}`).join(", "), st=Object.entries(STAMPS).map(([k,v])=>`${k} (${v.n})`).join(", ");
 const prompt=`Design a fantasy map in the style of a hand-painted RPG map.
Place: ${desc}
The map is a grid of exactly ${m.w} columns and ${m.h} rows. One letter per square for the ground.
Ground letters: ${legend}. Use only these letters.
Make it look natural: coastlines and rivers with curves, beaches between land and sea, roads that connect places, forests as clumps, mountain ranges as chains of rock. For indoor or dungeon maps use walls "#" around rooms of stone floor "o".
Then place stamps on top. Stamp types: ${st}. Forest-floor ("f") squares and rock ("k") squares get trees and mountains added automatically, so only list stamps for important features (towns, castles, towers, ruins, ships, caves, bridges, a compass rose).
Return ONLY JSON: {"name":string,"rows":[string] (exactly ${m.h} strings of exactly ${m.w} letters),"stamps":[{"k":stamp type,"x":number (0-${m.w}),"y":number (0-${m.h})}] (3 to 20),"labels":[{"x":number,"y":number,"text":string,"size":"s"|"m"|"l"|"xl"}] (3 to 10, one "xl" for the map's title or largest region)}`;
 M.busy=true; M.err=""; M.confirm=false; M.ctl=new AbortController(); render(true);
 try{ const r=await CAP.sample.json(prompt,{signal:M.ctl.signal,modelTier:"default"});
  const rows=Array.isArray(r&&r.rows)?r.rows:[]; if(!rows.length) throw {code:"invalid_json"};
  pushUndo(); const w=workMap(id), PW=w.w*R; const cnt={};
  for(let j=0;j<w.h;j++){ const row=String(rows[j]||""); for(let i=0;i<w.w;i++){ let ch=row[i]; if(!TER[ch]) ch=TER[String(ch||"").toLowerCase()]?String(ch).toLowerCase():"g"; cnt[ch]=(cnt[ch]||0)+1; for(let b=0;b<R;b++) for(let a=0;a<R;a++) w.paint[(j*R+b)*PW+i*R+a]=ch; } }
  w.base=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]; roughen(w,2);
  const objs=[]; const rr=rng(Date.now()%9999);
  for(let j=0;j<w.h;j++) for(let i=0;i<w.w;i++){ const ch=String(rows[j]||"")[i]; if(ch==="f"){ for(let n=0;n<2;n++) objs.push({k:FOREST[Math.floor(rr()*FOREST.length)],x:+(i+.15+rr()*.7).toFixed(2),y:+(j+.2+rr()*.7).toFixed(2),s:+(.85+rr()*.3).toFixed(2),f:rr()<.5}); }
   if(ch==="k"&&rr()<.3) objs.push({k:rr()<.25?"snowpeak":"mountain",x:+(i+.3+rr()*.4).toFixed(2),y:+(j+.7).toFixed(2),s:+(1.4+rr()*.7).toFixed(2)}); }
  arr(r.stamps,o=>o&&STAMPS[o.k]?{k:o.k,x:+Math.max(0,Math.min(w.w,num(o.x))).toFixed(2),y:+Math.max(0,Math.min(w.h,num(o.y))).toFixed(2),s:STAMPS[o.k].s}:null,30).forEach(o=>objs.push(o));
  w.objects=objs; w.labels=arr(r.labels,l=>l&&l.text?{x:+Math.max(0,Math.min(w.w,num(l.x))).toFixed(2),y:+Math.max(0,Math.min(w.h,num(l.y))).toFixed(2),text:str(l.text,40),size:["s","m","l","xl"].includes(l.size)?l.size:"m",style:"ink",hidden:false}:null,12);
  if(!w.name&&r.name) w.name=str(r.name,60); saveMapNow(); toast("Map drawn"); }
 catch(e){ M.err=aiErr(e); if(HIDE_CODES.includes(e&&e.code)) CAP.sample=null; }
 M.busy=false; render(true);
}

function matLog(id,line){ const m=clone(S.data.mats[id]); m.log=[line,...(m.log||[])].slice(0,20); put("mats",id,m,true); }
function freeSpot(id){ const mat=S.data.mats[id]; const mp=mat.mapId&&S.data.maps[mat.mapId]?workMap(mat.mapId):blankGrid(); const used=new Set(toks(id).map(t=>t.x+","+t.y));
 for(let y=0;y<mp.h;y++) for(let x=0;x<mp.w;x++){ if(used.has(x+","+y)) continue; if(mp.fogOn&&mp.fog[y*mp.w+x]!=="1") continue; const t=mp.paint[(y*R+2)*mp.w*R+x*R+2]; if(t==="#"||t==="d"||t==="l"||t==="w") continue; return [x,y]; } return [0,0]; }

 if(act==="matfog"){ ui.matFog=b.dataset.v; render("keep"); return; }
 const mid=(location.hash.match(/^#mat-(\w+)$/)||[])[1];
 if(act==="add-char"){ const cid=v("addChar"); const c=S.data.characters[cid]; if(!c) return; const [x,y]=freeSpot(id); const n=toks(id).length; putTok(id,rid(),{name:c.name||"Hero",charId:cid,x,y,size:1,color:TOKCOL[n%TOKCOL.length],init:0,hidden:false}); render("keep"); return; }
 if(act==="add-mon"){ const name=v("mon-name")||"Monster"; const hp=num(v("mon-hp")); const [x,y]=freeSpot(id); putTok(id,rid(),{name,hp,hpMax:hp,init:num(v("mon-init")),x,y,size:1,color:"#5b2c2c",hidden:$("#mon-hid").checked}); render("keep"); return; }
 if(act==="mat-roll"){ const d=+b.dataset.v, r=roll(d); matLog(id,`${isDM()?"DM":"Player"} rolled d${d}: ${r}${d===20&&r===20?" (natural 20!)":d===20&&r===1?" (natural 1)":""}`); render("keep"); return; }
 if(act==="init"){ const all=toks(id); if(!all.length){ toast("Add tokens first"); return; } const order=all.map(t=>({t:t.id,v:roll(20)+num(t.init)})).sort((a,b)=>b.v-a.v); const m=clone(S.data.mats[id]); m.order=order; m.turn=0; m.round=1; m.log=["Initiative rolled",...(m.log||[])].slice(0,20); put("mats",id,m,true); render("keep"); return; }
 if(act==="next-turn"){ const m=clone(S.data.mats[id]); const n=(m.order||[]).length; if(!n) return; m.turn=(num(m.turn)+1); if(m.turn>=n){ m.turn=0; m.round=num(m.round||1)+1; } put("mats",id,m,true); render("keep"); return; }
 if(act==="end-combat"){ const m=clone(S.data.mats[id]); m.order=[]; m.turn=0; m.round=1; put("mats",id,m,true); render("keep"); return; }
 if(act==="mat-name"){ const m=clone(S.data.mats[id]); m.name=v("mat-name"); put("mats",id,m,true); render("keep"); toast("Renamed"); return; }
 if(act==="mat-del"){ if(b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Tap again to delete"; b.classList.add("primary"); return; } toks(id).forEach(t=>delTok(id,t.id)); del("mats",id); go("playmat"); return; }

/* pointer: map editor, mat fog, token dragging */
let painting=null, drag=null;
function matMap(cv){ const mat=S.data.mats[cv.dataset.mat]; return mat&&mat.mapId&&S.data.maps[mat.mapId]?workMap(mat.mapId):null; }
document.addEventListener("pointerdown",e=>{
 const tok=e.target.closest&&e.target.closest(".tok");
 if(tok&&ui.matFog==="off"){ const mid=(location.hash.match(/^#mat-(\w+)$/)||[])[1]; if(!mid) return; e.preventDefault(); tok.setPointerCapture(e.pointerId);
  drag={el:tok,id:tok.dataset.tok,mid,sx:e.clientX,sy:e.clientY,ox:parseFloat(tok.style.left),oy:parseFloat(tok.style.top),moved:false}; ui.dragging=true; return; }
 const cv=e.target.closest&&e.target.closest("#mapcv,#matcv"); if(!cv||!isDM()) return;
 if(cv.id==="mapcv"){ if(!cv.closest(".mk-stage")) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); painting=cv; ui.dragging=true; mkDown(cv,e); return; }
 if(ui.matFog==="off") return; const m=matMap(cv); if(!m) return;
 e.preventDefault(); cv.setPointerCapture(e.pointerId); painting=cv; ui.dragging=true; const [sx,sy]=subAt(cv,e,m); fogAt(m,sx,sy,ui.matFog==="reveal"?"1":"0",3); queueMapSave(); redrawCanvases();
});
document.addEventListener("pointermove",e=>{
 if(drag){ const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy; if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true; drag.el.style.left=(drag.ox+dx)+"px"; drag.el.style.top=(drag.oy+dy)+"px"; return; }
 if(!painting) return;
 if(painting.id==="mapcv"){ mkMove(painting,e); return; }
 const m=matMap(painting); if(!m) return; const [sx,sy]=subAt(painting,e,m); fogAt(m,sx,sy,ui.matFog==="reveal"?"1":"0",3); queueMapSave(); redrawCanvases();
});
function endPointer(){
 if(drag){ const d=drag; drag=null; ui.dragging=false;
  if(!d.moved){ ui.matSel=d.id; render("keep"); return; }
  const Z=ui.matZoom, t=clone(S.data.tokens[d.mid]&&S.data.tokens[d.mid][d.id]); if(!t){ render("keep"); return; }
  const mat=S.data.mats[d.mid]; const mp=mat&&mat.mapId&&S.data.maps[mat.mapId]?workMap(mat.mapId):blankGrid();
  t.x=Math.max(0,Math.min(mp.w-1,Math.round((parseFloat(d.el.style.left)-Z*.08)/Z))); t.y=Math.max(0,Math.min(mp.h-1,Math.round((parseFloat(d.el.style.top)-Z*.08)/Z)));
  putTok(d.mid,d.id,t); ui.matSel=d.id; render("keep"); return; }
 if(painting){ if(painting.id==="mapcv") mkUp(); painting=null; ui.dragging=false; if(pending) setTimeout(()=>{ if(!ui.dragging) render(); },0); }
}
document.addEventListener("pointerup",endPointer); document.addEventListener("pointercancel",endPointer);

async function shopAi(id){ const A=ui.shop.ai; if(A.busy) return; const s=readShopForm(id); if(!s) return;
 const world=worlds().find(w=>w.name&&w.name===s.campaign); const money=chars().map(c=>num(c.money)).filter(Boolean);
 const prompt=`Stock a shop in a homebrew tabletop RPG.
Shop: ${s.name||"a general store"}${s.keeper?", run by "+s.keeper:""}. ${s.blurb||""}
${world?`World: ${world.name}. ${str(world.blurb,900)}`:""}
Currency: ${s.currency||"gold"}.
${s.items.length?`Items already on the shelves (don't repeat them; match their price scale): ${JSON.stringify(s.items.slice(0,12).map(i=>({name:i.name,price:i.price,rarity:i.rarity})))}`:""}
${money.length?`Player characters currently carry between ${Math.min(...money)} and ${Math.max(...money)} ${s.currency||"gold"}.`:""}
${A.hint?`The DM wants: ${A.hint}`:""}
Return ONLY JSON: {"items":[{"name":string,"cat":string (Weapons, Armor, Potions, Scrolls, Magic items, Gear, Food, Curiosities, or similar),"rarity":"Common"|"Uncommon"|"Rare"|"Very rare"|"Legendary"|"Artifact","price":number,"stock":number (1-10, or 0 for unlimited),"desc":string (one or two sentences: what it does, with any game effect)}] (6 to 10 items)}`;
 A.busy=true; A.err=""; A.ctl=new AbortController(); ui.shopDraft={id,s}; render(true);
 try{ const r=await CAP.sample.json(prompt,{signal:A.ctl.signal,modelTier:"default"});
  const add=arr(r&&r.items,it=>it&&it.name?{id:rid(),name:str(it.name,80),cat:str(it.cat,30),rarity:RARITY.find(x=>x.toLowerCase()===String(it.rarity||"").toLowerCase())||"Common",price:Math.max(0,num(it.price)),stock:num(it.stock)>0?Math.round(num(it.stock)):"",desc:str(it.desc,300),hidden:false}:null,12);
  if(!add.length) throw {code:"invalid_json"}; s.items=s.items.concat(add); ui.shopDraft={id,s}; toast(`${add.length} items added. Review them, then Save shop.`); }

const paysSp=s=>/skill\s*points?|^\s*sp\s*$/i.test(String(s&&s.currency||""));
const purse=(s,c)=>num(c&&(paysSp(s)?c.sp:c.money));
const FX_RE=/(exp|level|stat|sp|hpmax|mpmax|hp|mp|money)\s*([+-])\s*(\d+)/gi;
function fxText(e){ const L={exp:"EXP",level:"level",stat:"stat points",sp:"skill points",hpmax:"max HP",mpmax:"max energy",hp:"HP",mp:"energy",money:"money"}; const out=[]; String(e||"").replace(FX_RE,(m,k,sg,n)=>{ out.push(k.toLowerCase()==="money"?`${sg}${coinText(num(n))}`:num(n)>=999999?`full ${L[k.toLowerCase()]}`:`${sg}${n} ${L[k.toLowerCase()]}`); return m; }); return out.join(", "); }
function applyFx(c,e){ let any=false; String(e||"").replace(FX_RE,(m,k,sg,n)=>{ n=num(n)*(sg==="-"?-1:1); any=true; k=k.toLowerCase();
  if(k==="exp"){ const per=num(c.expPer)||100; c.exp=Math.max(0,num(c.exp)+n); while(c.exp>=per){ c.exp-=per; c.level=num(c.level)+1; c.sp=num(c.sp)+num(c.gainSp); c.stat=num(c.stat)+num(c.gainStat); } }
  else if(k==="level"){ c.level=num(c.level)+n; c.stat=Math.max(0,num(c.stat)+num(c.gainStat)*n); }
  else if(k==="stat") c.stat=Math.max(0,num(c.stat)+n); else if(k==="sp") c.sp=Math.max(0,num(c.sp)+n); else if(k==="money") c.money=Math.max(0,num(c.money)+n);
  else if(k==="hpmax"){ c.hpMax=Math.max(0,num(c.hpMax)+n); c.hpCur=Math.max(0,num(c.hpCur)+n); } else if(k==="mpmax"){ c.enMax=Math.max(0,num(c.enMax)+n); c.enCur=Math.max(0,num(c.enCur)+n); }
  else if(k==="hp") c.hpCur=Math.max(0,Math.min(num(c.hpMax)||Infinity,num(c.hpCur)+n)); else if(k==="mp") c.enCur=Math.max(0,Math.min(num(c.enMax)||Infinity,num(c.enCur)+n));
  return m; }); return any; }
function shopBuy(id,i,free){
 const s=getS(id); const it=s&&s.items[i]; const cid=v("shop-buyer"); const c=cid&&getC(cid); if(!it||!c) return;
 if(!inStock(it)){ toast("Sold out"); return; } if(s.open===false&&!free){ toast("The shop is closed"); return; }
 const price=free?0:num(it.price); if(purse(s,c)<price){ toast("Not enough "+(s.currency||"gold")); return; }
 if(paysSp(s)) c.sp=num(c.sp)-price; else c.money=num(c.money)-price;
 if(!applyFx(c,it.effect)) c.items=(c.items||[]).concat([{name:it.name,desc:[it.rarity,it.desc].filter(Boolean).join(" · "),buff:it.buff||"",equipped:""}]);
 if(stockOf(it)!=="") it.stock=Math.max(0,num(it.stock)-1);
 s.log=[`${c.name||"Someone"} ${free?"was given":"bought"} ${it.name}${free?"":" for "+(isCoinCur(s.currency)?coinText(price):fmt(price)+" "+(s.currency||"gold"))}`,...(s.log||[])].slice(0,30);
 put("characters",cid,c,true); put("shops",id,s,true); toast(free?`Gave ${it.name} to ${c.name||"them"}`:`Bought ${it.name}`); render("keep"); }

 if(act==="shop-cat"){ ui.shop.cat=b.dataset.v; render("keep"); return; }
 if(act==="buy"){ shopBuy(id,+b.dataset.i,false); return; }
 if(act==="give"){ shopBuy(id,+b.dataset.i,true); return; }
 if(act==="shop-open"){ const s=getS(id); s.open=s.open===false; put("shops",id,s,true); render("keep"); toast(s.open?"Shop opened":"Shop closed"); return; }
 if(act==="shop-money"){ const cid=v("shop-buyer"), c=cid&&getC(cid); const a=Math.abs(num(v("shop-money"))); if(!c||!a){ toast("Type an amount first"); return; } if(paysSp(getS(id))) c.sp=Math.max(0,num(c.sp)+num(b.dataset.v)*a); else c.money=Math.max(0,Math.round((num(c.money)+num(b.dataset.v)*a*coinValues()[v("shop-money-coin")||"gold"])*10000)/10000); put("characters",cid,c,true); render("keep"); return; }
 if(act==="save-shop"){ const s=readShopForm(id); if(!s) return; ui.shopDraft=null; put("shops",id,s,true); toast("Shop saved"); go("shop-"+id); return; }
 if(act==="shop-ai"){ ui.shop.ai.hint=v("s-aihint"); shopAi(id); return; }
 if(act==="shop-ai-stop"){ ui.shop.ai.ctl&&ui.shop.ai.ctl.abort(); return; }

async function treeAi(id){ const A=ui.treeAi; if(A.busy) return; const t0=getT(id); if(!t0) return;

Shape: ${n<=10?"2 to 4":n<=20?"3 to 5":"4 to 7"} branches. Each branch starts with one skill that needs nothing, then grows outward; later skills need the earlier skill in their branch. Add one or two capstone skills that need skills from two different branches. You may include one either/or fork: two skills that exclude each other.

Return ONLY JSON: {"name":string,"blurb":string (one sentence),"skills":[{"key":string (short unique id, like "f1"),"name":string,"rank":string,"desc":string (one sentence with its game effect),"icon":string (1 or 2 letters),"needs":[key],"anyOf":[key],"excludes":[key]}]}`;

/* ================= buffs & gear ================= */
const truthy=v=>v===true||v==="1"||v===1||v==="true";
const BUFF_RE=/([A-Za-z][A-Za-z .'_]*?)\s*([+-])\s*(\d+(?:\.\d+)?)\s*(%)?(?=\s*(?:,|;|$|and\b))/gi;
function bkey(s){ const k=String(s||"").trim().toLowerCase().replace(/\s+/g," "); if(/^(hp|hpmax|max hp|health|max health)$/.test(k)) return "__hp"; if(/^(mp|mpmax|max mp|energy|max energy|mana|max mana|chakra|chi|enmp)$/.test(k)) return "__en"; return k; }
function parseBuff(t){ const out=[]; String(t||"").replace(BUFF_RE,(m,stat,sg,n,pct)=>{ out.push({stat:stat.trim(),key:bkey(stat),n:num(n)*(sg==="-"?-1:1),pct:!!pct}); return m; }); return out; }
const buffText=t=>parseBuff(t).map(b=>`${b.n<0?"−":"+"}${fmt(Math.abs(b.n))}${b.pct?"%":""} ${b.key==="__hp"?"max HP":b.key==="__en"?"max energy":b.stat}`).join(", ")||String(t||"");
function activeBuffs(c){ const src=[]; (c.items||[]).forEach(it=>{ if(it&&it.buff&&truthy(it.equipped)) src.push({name:it.name,effect:it.buff,gear:true}); });
 (c.buffs||[]).forEach(b=>{ if(b&&(b.turns===""||b.turns==null||num(b.turns)>0)) src.push({name:b.name,effect:b.effect}); }); return src; }
function buffAgg(c){ const agg={}; activeBuffs(c).forEach(s=>parseBuff(s.effect).forEach(b=>{ const a=agg[b.key]=agg[b.key]||{label:b.key==="__hp"?"max HP":b.key==="__en"?"max energy":b.stat,flat:0,pct:0}; if(b.pct) a.pct+=b.n; else a.flat+=b.n; })); return agg; }
const isNumStat=v=>/^[\s\d,.\-]+$/.test(String(v||""))&&/\d/.test(String(v||""));
function effMax(c,k){ const base=num(k==="hp"?c.hpMax:c.enMax); const a=buffAgg(c)[k==="hp"?"__hp":"__en"]; return a?Math.max(0,Math.round(base+a.flat+base*a.pct/100)):base; }
function statCell(c,s){ const a=buffAgg(c)[bkey(s.k)]; if(!a) return esc(s.v||"—");
 if(isNumStat(s.v)){ const base=num(s.v), tot=Math.round(base+a.flat+base*a.pct/100), d=tot-base; return `${fmt(tot)} <small class="bonus ${d<0?"neg":""}">(${d<0?"−":"+"}${fmt(Math.abs(d))})</small>`; }
 return `${esc(s.v||"—")} <small class="bonus">(${a.flat?(a.flat>0?"+":"−")+fmt(Math.abs(a.flat)):""}${a.pct?(a.flat?", ":"")+(a.pct>0?"+":"−")+Math.abs(a.pct)+"%":""})</small>`; }
function buffBox(id,c){ const agg=buffAgg(c), chips=Object.values(agg).flatMap(a=>[a.flat?{t:`${a.flat>0?"+":"−"}${fmt(Math.abs(a.flat))} ${a.label}`,neg:a.flat<0}:null,a.pct?{t:`${a.pct>0?"+":"−"}${Math.abs(a.pct)}% ${a.label}`,neg:a.pct<0}:null]).filter(Boolean);
 const gear=(c.items||[]).map((it,i)=>({it,i})).filter(x=>x.it&&x.it.buff), temp=c.buffs||[];
 return `<div class="section"><div class="section-head"><h2>Buffs &amp; gear</h2><span class="muted">${activeBuffs(c).length} active</span></div>
 <div class="card" style="gap:14px">
  ${chips.length?`<div class="row">${chips.map(x=>`<span class="buff-chip ${x.neg?"neg":""}">${esc(x.t)}</span>`).join("")}</div>`:`<p class="meta">No buffs active. Equip gear that has a buff, or add a temporary buff below. Stats above update automatically.</p>`}
  ${gear.length?`<div style="display:grid;gap:6px"><span class="eyebrow">Gear with buffs</span><ul class="clean">${gear.map(({it,i})=>`<li class="row" style="justify-content:space-between;gap:8px"><span style="min-width:0"><b>${esc(it.name)}</b> <span class="meta">${esc(buffText(it.buff))}</span></span><button class="btn small ${truthy(it.equipped)?"primary":""}" data-act="eq-toggle" data-c="${id}" data-i="${i}" aria-pressed="${truthy(it.equipped)}">${truthy(it.equipped)?"Equipped":"Equip"}</button></li>`).join("")}</ul></div>`:""}
  <div style="display:grid;gap:6px"><span class="eyebrow">Temporary buffs</span>
   ${temp.length?`<ul class="clean">${temp.map((b,i)=>`<li class="row" style="justify-content:space-between;gap:8px"><span style="min-width:0"><b>${esc(b.name||"Buff")}</b> <span class="meta">${esc(buffText(b.effect))}${b.turns===""||b.turns==null?" · until removed":` · ${fmt(num(b.turns))} turn${num(b.turns)===1?"":"s"} left`}</span></span><button class="btn small" data-act="bf-del" data-c="${id}" data-i="${i}">Remove</button></li>`).join("")}</ul>
   <div><button class="btn small" data-act="bf-tick" data-c="${id}">End of turn (−1 turn)</button></div>`:`<p class="meta">None right now.</p>`}

 c.hpCur=Math.min(num(c.hpCur),effMax(c,"hp")||num(c.hpCur)); if(c.enMax) c.enCur=Math.min(num(c.enCur),effMax(c,"en")||num(c.enCur));

/* ================= coins: Bronze < Silver < Gold < Diamond < Platinum ================= */
const COINS=[["platinum","Platinum"],["diamond","Diamond"],["gold","Gold"],["silver","Silver"],["bronze","Bronze"]];
const COIN_DEF=[10,25,50,100,150]; // worth of bronze, silver, gold, diamond, platinum
function coinVals(){ const s=S.data.settings&&S.data.settings.coins; const r=(s&&Array.isArray(s.values))?s.values:COIN_DEF; const o={}; ["bronze","silver","gold","diamond","platinum"].forEach((k,i)=>o[k]=Math.max(1,Math.round(num(r[i])||COIN_DEF[i]))); return o; }
function coinValues(){ const v=coinVals(); const o={}; for(const k in v) o[k]=v[k]/v.gold; return o; } // each coin's worth in Gold (money is stored in Gold)
function coinsOf(gold){ const v=coinVals(); let u=Math.max(0,Math.round(num(gold)*v.gold)); const out=[];
 for(const [k] of [...COINS].sort((a,b)=>v[b[0]]-v[a[0]])){ const n=Math.floor(u/v[k]); if(n){ out.push([k,n]); u-=n*v[k]; } } return out; }
const coinName=k=>(COINS.find(x=>x[0]===k)||[k,k])[1];
function coinText(gold){ const c=coinsOf(gold); return c.length?c.map(([k,n])=>`${fmt(n)} ${coinName(k)}`).join(", "):"0 Gold"; }
function coinHTML(gold){ const c=coinsOf(gold); return `<span class="coins" title="${esc(coinText(gold))}">${(c.length?c:[["gold",0]]).map(([k,n])=>`<span class="coin c-${k}" aria-label="${fmt(n)} ${coinName(k)}"><i></i>${fmt(n)}</span>`).join("")}</span>`; }
function parseCoins(str){ const s=String(str==null?"":str).trim().toLowerCase(); if(!s) return 0; if(/^-?[\d,.]+$/.test(s)) return num(s); const vals=coinValues(); let t=0, any=false;
 s.replace(/([\d,.]+)\s*(platinum|plat|pp|p|diamonds?|dia|dp|d|gold|gp|g|silver|sp|s|bronze|bp|b|copper|cp|c)\b/g,(m,n,u)=>{ any=true; const k=/^p/.test(u)?"platinum":/^d/.test(u)?"diamond":/^g/.test(u)?"gold":/^s/.test(u)?"silver":"bronze"; t+=num(n)*vals[k]; return m; });
 return any?Math.round(t*10000)/10000:num(s); }
const isCoinCur=c=>/^(gold|coins?|money|gp|)$/i.test(String(c==null?"":c).trim());
const coinSelect=id=>`<select id="${id}" aria-label="Coin type">${COINS.map(([k,n])=>`<option value="${k}" ${k==="gold"?"selected":""}>${n}</option>`).join("")}</select>`;
function coinFields(gold){ const have=Object.fromEntries(coinsOf(gold)); return `<div class="fld wide"><span>Money</span><div class="coin-inputs">${COINS.map(([k,n])=>`<label class="coin-in"><span class="coin c-${k}"><i></i>${n}</span><input type="number" min="0" step="1" id="f-coin-${k}" value="${have[k]||0}" aria-label="${n}"></label>`).join("")}</div></div>`; }
function coinsFromForm(fallback){ if(!$("#f-coin-gold")) return num(fallback); const vals=coinValues(); let t=0; COINS.forEach(([k])=>{ t+=num(v("f-coin-"+k))*vals[k]; }); return Math.round(t*10000)/10000; }
function coinSection(){ const val=coinVals(), dm=isDM(), ks=["bronze","silver","gold","diamond","platinum"], gv=coinValues();
 return `<section class="section"><div class="section-head"><h2>Coins</h2></div><div class="split"><div class="card" style="gap:12px">
  <div class="ladder">${ks.map((k,i)=>`${i?'<span class="arrow">→</span>':""}<span class="coin c-${k}"><i></i>${coinName(k)}</span>`).join("")}</div>
  <ul class="clean">${ks.map((k,i)=>`<li class="row" style="gap:8px"><span class="coin c-${k}" style="min-width:6.5em"><i></i>${coinName(k)}</span> worth ${dm?`<input type="number" min="1" id="coin-val-${i}" value="${val[k]}" style="width:5.5em" aria-label="${coinName(k)} worth">`:`<b class="mono">${val[k]}</b>`}${k!=="gold"?` <span class="muted">= ${fmt(Math.round(gv[k]*100)/100)} Gold</span>`:""}</li>`).join("")}</ul>
  ${dm?`<div class="actions"><button class="btn primary small" data-act="coins-save">Save values</button><button class="btn small" data-act="coins-reset">Back to 10 · 25 · 50 · 100 · 150</button></div>`:""}</div>
  <div class="prose"><p>Each coin is worth a set amount: Bronze ${val.bronze}, Silver ${val.silver}, Gold ${val.gold}, Diamond ${val.diamond}, Platinum ${val.platinum}. Money is shown in the biggest coins first, so ${val.platinum+val.silver} worth shows as 1 Platinum and 1 Silver.</p><p class="muted">In shop prices you can type coins directly, like <b>5s</b>, <b>2d 1g</b> or <b>1p</b>. Plain numbers count as Gold.</p></div></div></section>`; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return;
 if(b.dataset.act==="coins-save"){ const values=[0,1,2,3,4].map(i=>Math.max(1,Math.round(num(v("coin-val-"+i))||COIN_DEF[i]))); put("settings","coins",{values},true); render(true); toast("Coin values saved"); }
 if(b.dataset.act==="coins-reset"){ put("settings","coins",{values:COIN_DEF.slice()},true); render(true); toast("Back to 10 · 25 · 50 · 100 · 150"); } });

  const rolls=Array.from({length:D.n},()=>roll(D.d)), total=rolls.reduce((a,x)=>a+x,0)+D.mod;
  const label=`${D.n}d${D.d}${D.mod?(D.mod>0?"+":"")+D.mod:""}: [${rolls.join(", ")}]${D.mod?(D.mod>0?" + ":" − ")+Math.abs(D.mod):""}`;
  D.last={n:D.n,d:D.d,rolls,total,label}; D.log.unshift(`${label} = ${total}`); D.log=D.log.slice(0,15); render(true); return; }
 if(act==="save-costs"){ const rows=collect("costs").filter(r=>r.rank).map(r=>({rank:r.rank,cost:num(r.cost)})); put("settings","rules",{costs:rows},true); render(true); toast("Costs saved"); return; }
 if(act==="reset-costs"){ put("settings","rules",{costs:DEFAULT_COSTS.map(([r,c])=>({rank:r,cost:c}))},true); render(true); toast("Default costs restored"); return; }
 const cid=b.dataset.c; if(!cid) return; const c=getC(cid); if(!c) return;
 if(act==="hp-"||act==="hp+"){ const a=Math.abs(num($("#hpAmt").value)); if(!a){toast("Type an amount first");return;} c.hpCur=Math.max(0,Math.min(effMax(c,"hp"),num(c.hpCur)+(act==="hp+"?a:-a))); }
 else if(act==="en-"||act==="en+"){ const a=Math.abs(num($("#enAmt").value)); if(!a){toast("Type an amount first");return;} c.enCur=Math.max(0,Math.min(effMax(c,"en"),num(c.enCur)+(act==="en+"?a:-a))); }
 else if(act==="rest"){ c.hpCur=effMax(c,"hp"); c.enCur=effMax(c,"en"); toast("Back to full"); }
 else if(act==="xp"){ const a=b.dataset.v?num(b.dataset.v):num($("#xpAmt").value); if(!a){toast("Type an amount of EXP first");return;} c.exp=num(c.exp)+a; let ups=0; const per=num(c.expPer)||100;
  while(c.exp>=per){ c.exp-=per; c.level=num(c.level)+1; c.sp=num(c.sp)+num(c.gainSp); c.stat=num(c.stat)+num(c.gainStat); ups++; }
  toast(ups?`Level up! Now level ${c.level}: +${fmt(num(c.gainSp)*ups)} skill points, +${fmt(num(c.gainStat)*ups)} stat points`:`+${a} EXP`); }
 else if(act==="money+"||act==="money-"){ const a=Math.abs(num($("#moneyAmt").value)); if(!a){toast("Type an amount first");return;} { const amt=a*coinValues()[v("moneyCoin")||"gold"]; c.money=Math.max(0,Math.round((num(c.money)+(act==="money+"?amt:-amt))*10000)/10000); } }
 else if(act==="sp"){ c.sp=Math.max(0,num(c.sp)+num(b.dataset.v)); }
 else if(act==="st"){ c.stat=Math.max(0,num(c.stat)+num(b.dataset.v)); }
 else return;
 put("characters",cid,c,true); render("keep");
});
document.addEventListener("input",e=>{
 if(e.target.id==="q"){ ui.q=e.target.value; const pos=e.target.selectionStart; $("#app").innerHTML=(S.note?`<div class="note">${esc(S.note)}</div>`:"")+viewCharacters(); const q=$("#q"); q.focus(); try{q.setSelectionRange(pos,pos);}catch(_){} }
});
document.addEventListener("change",e=>{
 if(e.target.id==="campSel"){ ui.camp=e.target.value; render(true); }
 if(e.target.id==="tc"){ ui.treeChar[e.target.dataset.t]=e.target.value; e.target.blur(); render("keep"); }
 if(e.target.id==="notes"){ const id=e.target.dataset.c, c=getC(id); if(c&&(c.notes||"")!==e.target.value){ c.notes=e.target.value; put("characters",id,c,true); } }
 if(e.target.id==="dn"||e.target.id==="dm"){ ui.dice.n=Math.max(1,Math.min(50,parseInt($("#dn").value)||1)); ui.dice.mod=parseInt($("#dm").value)||0; }
});
render(true);
initDb().then(initCaps);
</script>
